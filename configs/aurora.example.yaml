# Copy to an untracked user configuration file before use. This is a valid,
# hardware-free example; integrations stay disabled until explicitly enabled.
# Precedence: command line, environment variables, YAML, then safe defaults.
application:
  name: "Project Aurora"
  configuration_profile: "example"
logging:
  level: "INFO"
hyperhdr:
  enabled: false
  validation_timeout_seconds: 2.0
wled:
  enabled: false
  validation_timeout_seconds: 2.0
  # Set measured values only in an untracked deployment configuration.
  # expected_led_count:
  # expected_active_led_count:
  # expected_skipped_leds:
ddp:
  enabled: false
  # port defaults to the standard DDP port, 4048
capture_device:
  enabled: false
  # identifier: "/dev/video0"
lighting_zones: []
# Set orientation and starting_corner only after physical installation.
led_layout: {}
dashboard:
  # Loopback-only by default. Opt into a trusted-LAN bind explicitly.
  bind_host: "localhost"
  port: 8080
  refresh_seconds: 5
  cpu_temperature_warning_c: 80.0
  memory_warning_percent: 90.0
  storage_warning_percent: 90.0
  authentication:
    # Fail closed: protected routes are unavailable while disabled.
    enabled: false
    # Supply username and password_hash through the process environment when enabled.
    session_ttl_minutes: 480
    maximum_sessions: 16
    secure_cookie: false
    login_attempt_limit: 5
    login_attempt_window_seconds: 300
mqtt:  # Reserved for future automation and telemetry; never real-time frames.
  enabled: false
# Read-only WLED validation uses GET /json/info only when explicitly invoked.
# wled.validation_timeout_seconds defaults to 2.0 seconds (0.1–10.0).
# Read-only HyperHDR validation uses GET /json-rpc serverinfo only when explicitly invoked.
